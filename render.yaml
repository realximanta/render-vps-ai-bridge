services:
  - type: web
    name: render-vps-ai-bridge
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: API_KEY
        sync: false
      - key: NODE_VERSION
        value: 20.11.0
